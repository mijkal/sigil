<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="Sigil — a self-hosted hub for your terminal sessions: SSH into your machines, attach tmux, and drive every session from one browser tab." />
    <!-- Theme colour follows the OS light/dark preference (matches the app bg). -->
    <meta name="theme-color" content="#0A0A0C" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F8F9FC" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <!-- Don't auto-link phone numbers / addresses in terminal output. -->
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
    <!-- Installable web-app (standard + Apple). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Sigil" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "black", not "black-translucent". Translucent runs the web view UNDER the
         status bar and makes every top-anchored element responsible for its own
         safe-area inset — miss one and the header sits behind the iPad clock (seen
         on Drydock, same setting). "black" makes iOS reserve the strip so content
         starts below it; the shell is #0A0A0C, so the reserved bar is invisible.
         viewport-fit=cover stays — left/right and bottom insets still matter. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Sigil" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Launch images. Without these iOS shows a blank field on cold start of an
         installed app. The media query must match the device EXACTLY — a near miss
         is silently ignored and you are back to the blank field — so these are real
         CSS point sizes per device, portrait and landscape.

         device-width/height stay at the PORTRAIT values in BOTH orientations; that
         is how iOS evaluates them, and only `orientation` differentiates. Devices
         sharing a viewport share an image, which is why the 12/13/14 line and the
         15/16 line each appear once rather than per marketing name.

         Regenerate with scripts/gen-splash.py after adding a device. -->
    <link rel="apple-touch-startup-image" href="/splash/iphone-se-portrait.png"
      media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/iphone-se-landscape.png"
      media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)" />

    <!-- Explicit 180x180: iOS uses apple-touch-icon for the home screen, not the
         manifest icons, and renders any transparency in it as black. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Safari pinned tab needs a flat monochrome shape, not the plated app icon. -->
    <link rel="mask-icon" href="/mask-icon.svg" color="#4F46E5" />
