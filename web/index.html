<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="Sigil — a self-hosted hub for your terminal sessions: SSH into your machines, attach tmux, and drive every session from one browser tab." />
    <!-- Theme colour follows the OS light/dark preference (matches the app bg). -->
    <meta name="theme-color" content="#0A0A0C" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F8F9FC" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <!-- Don't auto-link phone numbers / addresses in terminal output. -->
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
    <!-- Installable web-app (standard + Apple). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Sigil" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sigil" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Safari pinned tab needs a flat monochrome shape, not the plated app icon. -->
    <link rel="mask-icon" href="/mask-icon.svg" color="#4F46E5" />
    <title>Sigil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
