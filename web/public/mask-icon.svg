<!-- Safari pinned-tab mask icon: one flat black shape on transparent, no plate.
     Safari tints it with the `color` attr on <link rel="mask-icon"> and renders it
     tiny, so this carries the heaviest spine of the set. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <g>
    <path d="M71 40 L66 22 L45 15 L28 27 L50 50 L72 73 L55 85 L34 78 L29 60" fill="none" stroke="#000000" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="71" cy="40" r="2.6" fill="#000000"/>
    <circle cx="66" cy="22" r="3.12" fill="#000000"/>
    <circle cx="45" cy="15" r="3.9" fill="#000000"/>
    <circle cx="28" cy="27" r="4.42" fill="#000000"/>
    <circle cx="50" cy="50" r="5.46" fill="#000000"/>
    <circle cx="72" cy="73" r="4.42" fill="#000000"/>
    <circle cx="55" cy="85" r="3.9" fill="#000000"/>
    <circle cx="34" cy="78" r="3.12" fill="#000000"/>
    <circle cx="29" cy="60" r="2.6" fill="#000000"/>
  </g>
</svg>
