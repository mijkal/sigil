name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Go — build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -timeout 120s

  frontend:
    name: Web — typecheck, test, lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run lint
      - run: bash scripts/lint-colors.sh
      - run: npx vite build
