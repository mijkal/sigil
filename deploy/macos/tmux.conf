# Durability settings for a tmux server holding long-lived agent sessions.
# Append to (or merge into) the session owner's ~/.tmux.conf.

# A tmux server exits when its LAST session closes. An orchestrator that creates
# short-lived sessions on the same server will, sooner or later, have one of them
# be the last one standing — and the whole server goes with it, taking every
# other session too. Keep the server resident.
set -s exit-empty off

# Never destroy a session just because no client is attached. sigild attaches and
# detaches constantly; a detach must not be able to end a work session.
set -g destroy-unattached off

set -g history-limit 200000
set -g focus-events on
